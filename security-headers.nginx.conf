# Заголовки безопасности для nginx. Подключаются внутрь блока server.
# Политику содержимого страницы уже несут сами, здесь остальное.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;

# Картинки, шрифты и стили именуются без отпечатка содержимого, поэтому срок
# жизни кэша умеренный: сутки для стилей и скриптов, месяц для картинок и шрифтов.
location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=86400";
}

location ~* \.(?:webp|png|jpg|jpeg|svg|woff2)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
}